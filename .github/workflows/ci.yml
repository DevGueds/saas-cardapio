name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm db:up
      - run: pnpm db:migrate
      - run: pnpm check:all
      - run: pnpm format:check
      - run: pnpm api:test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:api
      - run: pnpm docker:up
      - run: pnpm test:e2e:docker
      - run: pnpm audit --prod
      - if: always()
        run: pnpm docker:down
