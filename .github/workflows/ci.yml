name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  railway-configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --prefix .railway --ignore-scripts --no-audit --no-fund
      - run: npm --prefix .railway run check
      - run: node --test scripts/railway-readiness.test.mjs
  railway-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --prefix .railway --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-railway-images.mjs
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-secrets.mjs
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm db:up
      - run: pnpm db:migrate
      - run: pnpm --filter @cardapio/api db:check-schema
      - run: pnpm check:all
      - run: pnpm format:check
      - run: pnpm api:test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:api
      - run: pnpm docker:up
      - run: pnpm test:e2e:docker
      - run: pnpm test:docker:security
      - run: pnpm test:docker:resilience
      - run: pnpm audit --prod
      - name: Diagnose container failures
        if: failure() && hashFiles('backend/.env') != ''
        run: docker compose --env-file backend/.env --profile app logs --tail 80 api api-replica web
      - if: always() && hashFiles('backend/.env') != ''
        run: pnpm docker:down
