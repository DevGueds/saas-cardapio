name: cardapio-local
services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute pnpm setup:local}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: cardapio
      MYSQL_USER: cardapio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute pnpm setup:local}
    volumes:
      - cardapio_mysql:/var/lib/mysql
      - ./backend/docker/init.sh:/docker-entrypoint-initdb.d/10-cardapio.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -ucardapio -e 'SELECT 1' cardapio > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    working_dir: /workspace/backend
    command: ["pnpm", "db:migrate"]
    environment:
      MIGRATION_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?Execute pnpm setup:local}@mysql:3306/cardapio
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    init: true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: mysql://cardapio:${MYSQL_PASSWORD:?Execute pnpm setup:local}@mysql:3306/cardapio
      DATABASE_TLS: "false"
      SESSION_SECRET: ${SESSION_SECRET:?Execute pnpm setup:local}
      SESSION_TTL_SECONDS: 28800
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      SIGNUP_ENABLED: "true"
      DOCS_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  cardapio_mysql:
