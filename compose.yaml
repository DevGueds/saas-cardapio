name: cardapio-local
services:
  redis:
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    restart: unless-stopped
    user: "999:1000"
    command:
      [
        "sh",
        "-c",
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute pnpm setup:local}
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["cardapio_redis:/data"]
    mem_limit: 192m
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute pnpm setup:local}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: cardapio
      MYSQL_USER: cardapio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute pnpm setup:local}
    volumes:
      - cardapio_mysql:/var/lib/mysql
      - ./backend/docker/init.sh:/docker-entrypoint-initdb.d/10-cardapio.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -ucardapio -e 'SELECT 1' cardapio > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    working_dir: /workspace/backend
    command: ["pnpm", "db:migrate"]
    environment:
      MIGRATION_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?Execute pnpm setup:local}@mysql:3306/cardapio
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  api: &api
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    init: true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    environment: &api-environment
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIRECTORY: /app/logs
      LOG_INSTANCE: api
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: mysql://cardapio:${MYSQL_PASSWORD:?Execute pnpm setup:local}@mysql:3306/cardapio
      DATABASE_TLS: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Execute pnpm setup:local}@redis:6379/0
      TRUSTED_PROXY_CIDRS: 172.28.0.0/24
      HTTP_RATE_LIMIT: ${HTTP_RATE_LIMIT:-600}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-128}
      SESSION_SECRET: ${SESSION_SECRET:?Execute pnpm setup:local}
      SESSION_TTL_SECONDS: 28800
      CORS_ORIGINS: ${DOCKER_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost.invalid}
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Execute pnpm setup:local}
      SIGNUP_ENABLED: "true"
      DOCS_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    read_only: true
    volumes:
      - cardapio_logs:/app/logs
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  api-replica:
    <<: *api
    environment:
      <<: *api-environment
      LOG_INSTANCE: api-replica
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      api-replica:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
  evolution-db:
    profiles: ["app"]
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DATABASE_PASSWORD:?Execute pnpm setup:local}
    volumes: ["cardapio_evolution_db:/var/lib/postgresql/data"]
    mem_limit: 256m
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 20
  evolution:
    profiles: ["app"]
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    # Keep the upstream command, but gate all output (including native/child writes).
    entrypoint:
      [
        "node",
        "/opt/cardapio/provider-log-gate.cjs",
        "/bin/bash",
        "-c",
        ". ./Docker/scripts/deploy_database.sh && npm run start:prod",
      ]
    restart: unless-stopped
    init: true
    mem_limit: 768m
    pids_limit: 256
    environment:
      SERVER_URL: http://evolution:8080
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Execute pnpm setup:local}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DATABASE_PASSWORD:?Execute pnpm setup:local}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: cardapio_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:?Execute pnpm setup:local}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: cardapio_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR
      LOG_BAILEYS: fatal
      LOG_COLOR: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Cardapio
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "10"
      CORS_ORIGIN: http://cardapio-internal
      CORS_CREDENTIALS: "false"
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - cardapio_evolution_instances:/evolution/instances
      - ./docker/provider-log-gate.cjs:/opt/cardapio/provider-log-gate.cjs:ro
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/',{headers:{origin:'http://cardapio-internal'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
volumes:
  cardapio_evolution_db:
  cardapio_evolution_instances:
  cardapio_logs:
  cardapio_mysql:
  cardapio_redis:
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
