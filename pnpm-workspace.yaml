packages:
  - "."
  - "backend"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  argon2: true
  core-js: false
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - "@fastify/helmet@13.2.0"
  - fastify@5.12.7

# Security fixes within the supported Fastify 5 / Prisma 7 stack. See docs/backend.md.
overrides:
  fastify: 5.12.7
  deepmerge-ts: 8.0.2

  "fast-uri@^3": 3.1.9
  "fast-uri@^4": 4.2.3
