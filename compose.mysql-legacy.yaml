# Recovery/import only. The application never depends on this service.
name: cardapio-local
services:
  mysql:
    networks: [legacy]
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute pnpm setup:local}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: cardapio
      MYSQL_USER: cardapio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute pnpm setup:local}
    volumes:
      - cardapio_mysql:/var/lib/mysql
      - ./backend/docker/init.sh:/docker-entrypoint-initdb.d/10-cardapio.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -ucardapio -e 'SELECT 1' cardapio > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  cardapio_mysql:
networks:
  legacy:
